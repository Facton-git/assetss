<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JaySecure Mail</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>

<body>

<div class="mailbox">

  <aside class="sidebar">

    <div class="brand white">📧 JaySecure Mail</div>

    <button class="compose-btn" onclick="openCompose()">
      + Compose
    </button>

    <div class="menu" onclick="showInbox()">
      Inbox <span id="inboxCount">0</span>
    </div>

    <div class="menu" onclick="showSent()">
      Sent <span id="sentCount">0</span>
    </div>

    <div class="menu" onclick="showDrafts()">
      Drafts <span id="draftCount">0</span>
    </div>

    <div class="menu" onclick="showArchived()">
      Archived <span id="archivedCount">0</span>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div>
        <h2 id="mailTitle">Inbox</h2>
        <small id="userEmail">user@jaysecure.com</small>
      </div>

      <input
        id="searchMail"
        type="text"
        placeholder="Search emails..."
        onkeyup="filterMail()"
      >

    </header>

    <section class="mail-area">

      <div id="mailList" class="mail-list"></div>

      <div class="preview">
        <h2 id="previewTitle">Select an email</h2>
        <p id="previewMeta"></p>
        <p id="previewBody"></p>
      </div>

    </section>

  </main>

</div>

<!-- COMPOSE MODAL -->
<div id="composeModal" class="modal">

  <div class="modal-card">

    <button class="close" onclick="closeCompose()">×</button>

    <h2>Compose Email</h2>

    <label>To</label>
    <input id="composeTo" type="email">

    <label>Subject</label>
    <input id="composeSubject" type="text">

    <label>Message</label>
    <textarea id="composeBody"></textarea>

    <button class="btn primary" onclick="sendEmail()">
      Send Email
    </button>

  </div>

</div>

<div id="toast" class="toast"></div>

<script src="assets/app.js"></script>
<script>
  loadMailbox();
</script>

</body>
</html>
