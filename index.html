<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JaySecure App Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link

    <link rel="stylesheet" href="assets/styles.css">

</head>

<body>

    <div class="center-screen">

        <div class="card">

            <p class="muted">

            </p>

            <a class="btn primary" href="otp-phone.html">

            </a>

            <a class="btn light" href="validate-otp.html">

            </a>

            <br>

            <hr>

            <br>

            <button
                class="btn google"
                onclick="loginWithGoogle()">

                    src="./assets/Google_Favicon_2025.svg.webp"
                    alt="Google"
                    height="32">

                Login with Google Account

            <p class="note">

                Prototype system built using

            </p>
